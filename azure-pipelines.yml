# Denodo 自動上版 pipeline（經由 APIM 連線內網 Solution Manager）
# 僅接受 API 或手動觸發，避免與來源端的 push 重複觸發
trigger: none
pr: none

parameters:
  # 分階段驗證：environments → servers → revision → validate → deploy
  # revision 與 validate 不會變動任何環境，可安心執行
  - name: stage
    type: string
    default: environments
    values:
      - environments
      - servers
      - revision
      - validate
      - deploy

  # 要過版的 view 清單，逗號分隔，須帶 database 前綴，
  # 例如 admin.rv_scheduler_job_result,sap.rv_aclmes_asplus_warr_expiring
  # 指定後會呼叫 APIM 上的 DESC API 取得展開相依後的完整 VQL。
  # 填 - 時改讀 vqlFile。
  - name: components
    type: string
    default: '-'

  # DESC VQL 的匯出選項，格式 key=value,key2=value2。
  # 留空使用預設：
  #   includeDependencies=yes                        一併匯出相依物件
  #   include_dependencies_from_all_databases=yes    跨 database 相依一併納入
  #   dropElements=no                                不產生 DROP 語句
  #   replaceExistingElements=yes                    產生 CREATE OR REPLACE
  # 其他可用：includeStatistics、format_vql、
  #           includeEnvSpecificElements、includeNonEnvSpecificElements
  - name: descOptions
    type: string
    default: '-'

  # APIM 上 DESC API 的路徑，接在 SM 前綴之後
  - name: descApiPath
    type: string
    default: '/descVql'

  # 模擬用：填 repo 內存放的 DESC 回傳檔路徑（例如 vql/desc_response.json）。
  # 指定後不呼叫 APIM，改讀這個檔案，其餘流程完全相同；
  # components 可維持 -，會由檔內的 requested_name 取得。
  # DESC API 上線後留 - 即可。
  - name: descResponseFile
    type: string
    default: '-'

  # 模擬用：同一批 view 以 'includeProperties' = 'no' 取得的 DESC 回傳檔。
  # Denodo 的 DESC 只回傳 ${變數} 不回傳值，腳本比對兩份回傳檔取出 DEV 的值組成 properties。
  # 呼叫真正的 DESC API 時腳本會自動打第二次，留 - 即可。
  - name: descLiteralResponseFile
    type: string
    default: '-'

  # 目標環境，可填名稱或數字 id，腳本會自動解析
  - name: environment
    type: string
    default: ACLDTPLTFRM-PRD

  # 留空或填 - 時由腳本從目標環境的 server 清單自動推導
  - name: clusterId
    type: string
    default: '-'

  - name: revisionName
    type: string
    default: '-'
  - name: revisionDescription
    type: string
    default: '-'
  # 建議用檔案路徑：VQL 直接 commit 進 repo，腳本自行讀檔、去 BOM、轉 base64
  # 可避免大型 VQL 超出 pipeline 參數與 APIM body 的大小上限
  - name: vqlFile
    type: string
    default: 'vql/deploy.vql'
  # 只有 VQL 檔頭標記需搭配 properties 檔時才需要（DESC 產出的 VQL 不需要）。
  # 填 - 表示不使用；填了路徑但檔案不存在會中止。
  - name: propertiesFile
    type: string
    default: '-'

  # 小型 VQL 臨時測試用，填了會覆蓋上面的檔案路徑
  - name: vqlContentBase64
    type: string
    default: '-'
  - name: propertiesBase64
    type: string
    default: '-'

  # 預設為 false：若有屬性會回退使用開發環境的值，驗證即失敗並中止。
  # 僅在明確確認過該差異可接受時才改為 true。
  # 字串而非 boolean：透過 REST API 的 templateParameters 傳入時，
  # 字串不會有型別轉換的歧義。
  - name: allowRevisionFallback
    type: string
    default: 'false'
    values:
      - 'false'
      - 'true'

  # 哪些 datasource 由這次部署的 VQL 建立／覆蓋。
  #   *（預設）  DESC 帶出的 datasource 全部放行，PRD 的值由 SM 的環境屬性機制決定
  #   -          全部從 VQL 剔除，PRD 上既有的完全不動（保守模式）
  #   db.ds,...  只放行列出的（例如 poc.ds_twse），其餘剔除
  - name: createDatasources
    type: string
    default: '*'

  # 驗證時「回退使用 revision（DEV）值」的屬性如何處理。
  #   new-elements（預設）  PRD 尚不存在的 datasource 及其 base view 自動使用 DEV 的值；
  #                         PRD 既有的元素一律不准套用 DEV 值（既有的取 PRD 環境設定或伺服器現值）
  #   none                  全部視為錯誤，需逐一以 allowFallbackFor 放行（舊行為）
  - name: fallbackPolicy
    type: string
    default: 'new-elements'
    values: ['new-elements', 'none']

  # 逗號分隔。屬性名稱含其中任一字串者，允許回退使用來源端（DEV）的值，
  # 其餘仍視為錯誤。用於第一次上線的新 datasource（填其名稱，例如 ds_twse）。
  # 比 allowRevisionFallback 安全：只放行指定的，不是全部。
  - name: allowFallbackFor
    type: string
    default: '-'

pool:
  vmImage: ubuntu-latest

variables:
  # ADO 的 Pipelines → Library 中的 variable group，內含
  # apimBaseUrl / apimSubscriptionKey / apimLoginEmail / apimLoginPassword
  - group: denodo-apim-cicd

  # 旗標型參數。條件式（if）不能直接寫在 arguments 這種字串值裡面，
  # 所以先在這裡依參數產生旗標字串（開啟時為旗標，否則為空字串），
  # 再於 arguments 以 variables.xxx 的範本運算式帶入。
  - ${{ if eq(parameters.allowRevisionFallback, 'true') }}:
      - name: allowRevisionFallbackFlag
        value: '--allow-revision-fallback'
  - ${{ if ne(parameters.allowRevisionFallback, 'true') }}:
      - name: allowRevisionFallbackFlag
        value: ''

name: $(Date:yyyyMMdd)$(Rev:.r)-${{ parameters.stage }}

steps:
  - checkout: self

  - script: |
      echo "stage       = ${{ parameters.stage }}"
      echo "components  = ${{ parameters.components }}"
      echo "descResponseFile = ${{ parameters.descResponseFile }}"
      echo "environment = ${{ parameters.environment }}"
      echo "clusterId   = ${{ parameters.clusterId }}"
      echo "revisionName = ${{ parameters.revisionName }}"
      echo "vqlFile     = ${{ parameters.vqlFile }}"
      echo "vql base64 長度 = ${#VQL_B64}"
    displayName: 記錄輸入參數
    env:
      VQL_B64: ${{ parameters.vqlContentBase64 }}

  - script: python -m pip install --upgrade pip requests
    displayName: 安裝相依套件

  - task: PythonScript@0
    displayName: 呼叫 Denodo Solution Manager
    inputs:
      scriptPath: create_and_deploy.py
      arguments: >-
        --stage "${{ parameters.stage }}"
        --components "${{ parameters.components }}"
        --desc-api-path "${{ parameters.descApiPath }}"
        --desc-response-file "${{ parameters.descResponseFile }}"
        --desc-literal-response-file "${{ parameters.descLiteralResponseFile }}"
        --desc-options "${{ parameters.descOptions }}"
        --environment "${{ parameters.environment }}"
        --cluster-id "${{ parameters.clusterId }}"
        --name "${{ parameters.revisionName }}"
        --description "${{ parameters.revisionDescription }}"
        --vql-file "${{ parameters.vqlFile }}"
        --properties-file "${{ parameters.propertiesFile }}"
        --vql-base64 "${{ parameters.vqlContentBase64 }}"
        --properties-base64 "${{ parameters.propertiesBase64 }}"
        --create-datasources "${{ parameters.createDatasources }}"
        --allow-fallback-for "${{ parameters.allowFallbackFor }}"
        --fallback-policy "${{ parameters.fallbackPolicy }}"
        ${{ variables.allowRevisionFallbackFlag }}
    env:
      APIM_BASE_URL: $(apimBaseUrl)
      # secret 變數不會自動注入環境，必須在這裡顯式對應
      APIM_SUBSCRIPTION_KEY: $(apimSubscriptionKey)
      APIM_LOGIN_EMAIL: $(apimLoginEmail)
      APIM_LOGIN_PASSWORD: $(apimLoginPassword)

  # 輸出結果供呼叫端取用。即使前一步失敗也執行，
  # 讓 bot 能從 timeline API 取回驗證摘要呈現給使用者。
  - script: |
      [ -n "${REVISION_ID}" ] && echo "revision   = ${REVISION_ID}"
      [ -n "${DEPLOYMENT_ID}" ] && echo "deployment = ${DEPLOYMENT_ID}"
      [ -n "${VALIDATION_STATE}" ] && echo "validation = ${VALIDATION_STATE}"
      [ -n "${VALIDATION_SUMMARY}" ] && echo "摘要       = ${VALIDATION_SUMMARY}"
      exit 0
    displayName: 輸出結果編號
    condition: succeededOrFailed()
    env:
      REVISION_ID: $(revisionId)
      DEPLOYMENT_ID: $(deploymentId)
      VALIDATION_STATE: $(validationState)
      VALIDATION_SUMMARY: $(validationSummary)
